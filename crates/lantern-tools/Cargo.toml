[package]
name = "lantern-tools"
version = "0.2.0"
description = "File and shell tools shared by the Lantern app and Lantern Hub"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
