[package]
name = "lantern-hub"
version = "0.5.0"
description = "Lantern Hub — one shared Lantern environment for all your devices"
authors = ["Lantern contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[dependencies]
lantern-tools = { path = "../crates/lantern-tools" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
base64 = "0.22"
libc = "0.2"
# Bots' own mailboxes: IMAP to read, SMTP to send, both over TLS with Mozilla's roots.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
mail-parser = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
