[package]
name = "lantern-hub"
version = "0.3.0"
description = "Lantern Hub — one shared Lantern environment for all your devices"
authors = ["Lantern contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[dependencies]
lantern-tools = { path = "../crates/lantern-tools" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
